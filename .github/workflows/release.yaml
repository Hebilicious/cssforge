# Release pipeline.
#
# npm is the primary channel and is published with npm trusted publishing
# (OIDC), which needs the `id-token: write` permission on the publishing job.
# Provenance attestations are generated by the registry during the same
# exchange.
#
# JSR is the secondary channel. It runs as its own job after npm, and neither
# channel can end up ahead of the other without a failed workflow:
#
#   * publishing is idempotent per channel (`cssforge:npm-publish`,
#     `cssforge:jsr-publish`): a version that is already on a registry is never
#     published twice;
#   * each publish retries transient failures, and a failed job can be re-run
#     from the Actions UI, or the whole pipeline with a manual dispatch.
#
# One-time bootstrap: npm cannot configure a trusted publisher for a package
# that does not exist yet, so the very first version has to be published once
# from a machine with interactive npm authentication. After that, add this
# workflow as a trusted publisher in the package settings on npmjs.com
# (organization `Hebilicious`, repository `cssforge`, workflow `release.yaml`).

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          # Publishing runs in the dedicated jobs below, so this command only
          # exists to keep the generated release PR body accurate about the
          # merge triggering a release. The action scans its output for
          # "New tag:" lines to create tags, which this command never prints.
          publish: echo "Publishing runs in the npm and jsr jobs of this workflow"
          commit: "chore(release): update release metadata"
          title: "release: update packages"
          version: moon exec --ignore-ci-checks root:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      # The gate runs on its own before anything can rewrite release metadata,
      # so a drifting release checkout fails instead of being published.
      - name: Check release metadata consistency
        run: moon run --force cssforge:version-check

      # `--force` suppresses moon's InstallDependencies action, without which the
      # gate aborts with `tsup: command not found` before anything publishes.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before either publish path: npm goes first, so a slow-type violation
      # found only by JSR would otherwise ship to npm already.
      - name: Check JSR publishability
        run: moon exec --ignore-ci-checks --force cssforge:jsr-dry-run

      - name: Smoke test the packaged artifact
        run: moon exec --ignore-ci-checks cssforge:smoke-test

      - name: Publish to npm
        run: moon exec --ignore-ci-checks cssforge:npm-publish

  jsr:
    name: Publish to JSR
    needs:
      - version
      - npm
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check release metadata consistency
        run: moon run --force cssforge:version-check

      # Same reason as the npm job.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap re-check before the JSR publish path.
      - name: Check JSR publishability
        run: moon exec --ignore-ci-checks --force cssforge:jsr-dry-run

      - name: Publish to JSR and verify the published entry points
        run: moon exec --ignore-ci-checks cssforge:jsr-publish
