name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      # Runs before `moon ci` so the gate reads the committed metadata and not a
      # tree repaired by another task in the same pipeline. `cssforge:version-sync`
      # is excluded from CI for the same reason.
      - name: Check release metadata consistency
        run: moon run --force cssforge:version-check

      # `moon exec` runs a task without the pipeline actions that `moon ci` and
      # `moon run` perform, so dependencies are installed explicitly here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `cssforge:jsr-smoke` runs the JSR entry points, but only JSR's own slow
      # type analysis rejects a public API without explicit types. That defect
      # breaks `jsr publish` after npm has already been published, so it has to
      # gate the pull request. Moon resolves the build this target depends on.
      #
      # `moon exec --ignore-ci-checks` is required: `jsr-dry-run` is
      # `runInCI: false` on purpose (it is a gate, not a `moon ci` task), and
      # `moon run` refuses to execute such a task in a CI environment.
      - name: Check JSR publishability
        run: moon exec --ignore-ci-checks --force cssforge:jsr-dry-run

      - name: Run CI
        run: moon ci

  browser-e2e:
    name: Browser e2e (theme scoping)
    runs-on: ubuntu-latest

    # Pull requests only. The suite exists to stop a token or scoping
    # regression from reaching main, and `moon ci` does not select it (every
    # example task stays `runInCI: false`), so this job is what runs it.
    # Guarding on `pull_request` keeps the browser download off the
    # push-to-main run, whose commit was already gated by its own PR.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      # `moon exec` below skips the pipeline actions that install dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `--filter` is required: `@playwright/test` is a dependency of the
      # example package, not of the workspace root, so `pnpm exec playwright`
      # from the root cannot resolve the binary.
      #
      # Chromium only: it is the single project in the example's Playwright
      # config.
      - name: Install Playwright browsers
        run: pnpm --filter vanilla-react-css exec playwright install --with-deps chromium

      # `vanilla-react-css:e2e` is `runInCI: false` like every other example
      # task, so `moon run` refuses it in a CI environment.
      - name: Run the browser suite
        run: moon exec --ignore-ci-checks --force vanilla-react-css:e2e

  node-floor:
    name: Package smoke on Node 24.0.0
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      # 24.0.0 is the floor declared by the package `engines` field.
      - name: Setup Node 24.0.0
        uses: actions/setup-node@v4
        with:
          node-version: "24.0.0"
          package-manager-cache: false

      - name: Smoke test the packed package on the supported engine floor
        run: moon run cssforge:smoke-test -- --node "$(command -v node)"

  jsr-entries:
    name: JSR entry points
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          moon-version: "2.0.0"
          auto-install: true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test the JSR entry points with Deno
        run: moon run cssforge:jsr-smoke -- --require-deno
