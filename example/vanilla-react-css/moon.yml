$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "application"

dependsOn:
  - "cssforge"
  - "unplugin"

tasks:
  build:
    script: "tsc -b && vite build"
    deps:
      - "^:build"
    options:
      runInCI: false
  dev:
    command: "vite"
    deps:
      - "^:build"
    preset: "server"
    options:
      runInCI: false
  dev-e2e:
    command: "vite"
    args: ["--host", "127.0.0.1", "--port", "4177"]
    deps:
      - "^:build"
    preset: "server"
    options:
      runInCI: false
  lint:
    command: "eslint"
    args: ["."]
    options:
      runInCI: false
  preview:
    command: "vite"
    args: ["preview"]
    deps:
      - "~:build"
    preset: "server"
    options:
      runInCI: false
  e2e:
    command: "playwright"
    args: ["test"]
    deps:
      - "^:build"
    options:
      runInCI: false
  e2e-headed:
    command: "playwright"
    args: ["test", "--headed"]
    deps:
      - "^:build"
    options:
      runInCI: false
  cssforge-build-local:
    command: "moon"
    args: ["run", "cssforge:pack"]
    options:
      runInCI: false
