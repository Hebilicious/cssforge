$schema: "https://moonrepo.dev/schemas/v2/toolchains.json"

javascript:
  packageManager: "pnpm"
  inferTasksFromScripts: false

node: {}

pnpm: {}

typescript:
  # The plugin rewrites project references into the tracked root and project
  # `tsconfig.json` files, leaving the repository dirty after every task
  # (issue #51). Those references are committed, so moon need not manage them.
  # This also disables `createMissingConfig` from the same plugin guard; every
  # project ships a `tsconfig.json`.
  syncProjectReferences: false
