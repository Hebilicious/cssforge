$schema: "https://moonrepo.dev/schemas/v2/toolchains.json"

javascript:
  packageManager: "pnpm"
  inferTasksFromScripts: false

node: {}

pnpm: {}

typescript:
  # The TypeScript toolchain plugin adds every synced project as a reference to
  # the workspace root `tsconfig.json`. Both that root config and the project
  # configs are tracked, so every task that synced a project left the
  # repository dirty (issue #51). The project references this repository needs
  # are committed in those files, so moon does not have to manage them.
  # Disabling the sync also turns off `createMissingConfig`, which sits in the
  # same plugin guard, so moon no longer auto-creates a missing project
  # `tsconfig.json`; every project currently ships one.
  syncProjectReferences: false
